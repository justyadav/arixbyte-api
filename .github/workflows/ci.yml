name: CI Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
       
      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Run Linter
        run: npm run lint

      - name: Verify TypeScript Build
        run: npm run build
